[project]
name = "novelai-private-plugin"
version = "0.2.0"
description = "Local NovelAI image tools for Codex and MCP"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.20,<2",
    "httpx>=0.28,<1",
    "pillow>=11,<13",
    "jsonschema>=4.23,<5",
    "msgpack>=1.1,<2",
]

[project.scripts]
novelai-private = "novelai_private.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novelai_private"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/scripts", "/skills", "/tests", "/README.md", "/LICENSE", "/NOTICE", "/config.example.toml", "/pyproject.toml", "/uv.lock", "/.gitignore"]
